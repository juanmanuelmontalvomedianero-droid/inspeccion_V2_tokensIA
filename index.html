<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspección MT - TECSUR / LDS</title>
  <style>
    :root {
      --primary: #0056b3;
      --success: #28a745;
      --warning: #e0a800;
      --bg: #f0f2f5;
      --card: #ffffff;
      --accent: #e7f1ff;
      --border: #dbe2ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 10px;
      color: #212529;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    .panel {
      background: var(--card);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    h2 {
      margin: 0 0 10px 0;
      color: var(--primary);
      font-size: 18px;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #0f172a;
      background: #f1f5f9;
      padding: 8px 10px;
      border-radius: 6px;
      margin: 14px 0 8px 0;
      border-left: 4px solid var(--primary);
    }

    /* Caja de texto y temporizador */
    .input-box-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      height: 70px;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      font-family: inherit;
      resize: none;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0,86,179,0.15);
    }

    /* Barra visual de cuenta regresiva de 10s */
    .timer-bar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 2px;
    }
    .timer-badge {
      font-weight: bold;
      color: var(--primary);
    }
    .timer-badge.active {
      color: var(--warning);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }
    button {
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-process {
      background: var(--primary);
      color: white;
    }
    .btn-cam {
      background: var(--success);
      color: white;
    }

    /* Monitor en tiempo real */
    .rt-monitor {
      background: #1e293b;
      color: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
      margin-top: 8px;
    }
    .rt-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .rt-tags-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .rt-item {
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-field {
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .badge-arrow { color: #38bdf8; }
    .badge-value {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Galería */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 6px;
      margin-top: 6px;
    }
    .photo-thumb {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ccc;
    }
    .photo-thumb img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.3s ease;
    }
    .form-group.updated {
      background: var(--accent);
      border-left: 3px solid var(--primary);
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 2px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .status {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="panel">
      <h2>Inspección de Red MT (TECSUR/LDS)</h2>
      
      <!-- Entrada con dictado nativo -->
      <div class="input-box-container">
        <textarea id="dictadoInput" placeholder="Toca aquí y usa el micrófono del teclado. Se procesará tras 10s de pausa o al pulsar el botón..."></textarea>
        
        <div class="timer-bar-container">
          <span>Auto-procesamiento en pausa:</span>
          <span id="countdownBadge" class="timer-badge">Inactivo</span>
        </div>

        <div class="btn-grid">
          <button id="btnProcesar" class="btn-process">
            <span>⚡</span> Clasificar Texto
          </button>
          <button id="btnPhoto" class="btn-cam">
            <span>📷</span> Foto
          </button>
        </div>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

      <!-- Monitor de campos clasificados -->
      <div class="rt-monitor">
        <div class="rt-title">En tiempo real (Última clasificación)</div>
        <div id="rtTagsContainer" class="rt-tags-container">
          <div class="rt-item">
            <span class="badge-field">esperando_ingreso</span>
            <span class="badge-arrow">➔</span>
            <span class="badge-value">sin datos</span>
          </div>
        </div>
      </div>

      <div id="statusText" class="status">Listo para recibir dictado o fotos.</div>

      <!-- Galería de fotos -->
      <h4 style="margin: 8px 0 2px 0; font-size: 11px; color: #555;">
        Fotos en sesión <span id="photoCounter">(0)</span>
      </h4>
      <div id="photoContainer" class="photo-grid"></div>
    </div>

    <!-- Formulario completo -->
    <div class="panel">
      <h3 style="margin-top:0; color:#0056b3;">Catálogo de Inspección Completo</h3>
      <div id="dynamicForm"></div>
    </div>

  </div>

  <script>
    // Catálogo completo según schema_mt.py
    const SCHEMA_MT = {
      "Datos Principales": [
        "sst", "set", "nro_alimentador", "tipo_nodo_inicial", "nro_nodo_inicial",
        "tipo_nodo_final", "nro_nodo_final", "tipo_activo_principal", "cod_activo_principal",
        "tipo_activo_referencia", "cod_activo_referencia", "incluido_en_bd", "posibilidad_inspeccion_poste"
      ],
      "Características Generales": [
        "marca", "tipo_poste", "altura_poste", "rotulado_estructura", "etiquetado", "clase_armado", "propiedad_red"
      ],
      "Corrosión e Inclinación": [
        "estado_inclinacion", "corrosion_base", "corrosion_cuerpo_cac", "corrosion_cuerpo_madera", "zocalo", "cimentado", "nivel_empotramiento"
      ],
      "Red Aérea MT": [
        "tipo_conductor_emt", "estado_red_aerea", "cruce_via", "objetos_extranos", "acercamiento_arboles", "ubicacion_arboles"
      ],
      "Ubicación e Impactos": [
        "ubicacion_poste", "tipo_suelo", "expuesto_impacto", "cuenta_proteccion", "estado_riel_bloque"
      ],
      "Conectores y Grapas": [
        "estado_conectores", "estado_grapas"
      ],
      "Aisladores": [
        "existen_aisladores", "tipo_aislador", "contaminacion_aislador", "descarga_aislador", "varilla_soporte", "estado_general_aislador"
      ],
      "Ménsulas y Crucetas": [
        "existen_mensulas", "tipo_mensula", "estado_cruceta_cac", "estado_cruceta_madera", "ferreteria_soporte", "estado_diagonales"
      ],
      "Plataforma y Palomilla": [
        "existe_plataforma", "tipo_plataforma", "estado_plataforma", "tipo_palomilla", "estado_palomilla"
      ],
      "Seccionadores": [
        "existe_seccionador", "estado_seccionador", "contaminacion_seccionador", "descarga_seccionador", "mensula_seccionador"
      ],
      "Terminales": [
        "existen_terminales", "tipo_terminales", "estado_terminal", "contaminacion_terminal", "descarga_terminal"
      ],
      "Subidas y Bajadas": [
        "existe_subidas_bajadas", "tipo_proteccion_cable", "estado_proteccion_cable"
      ],
      "Tableros y Comunicaciones": [
        "tipo_tablero", "tamano_tablero", "estado_general_tablero", "corrosion_tablero", "ferreteria_tablero", "tipo_proteccion_com_bt", "estado_proteccion_com_bt"
      ],
      "Puesta a Tierra": [
        "conexion_tierra_mt", "rotulado_pat", "estado_pozo_mt"
      ],
      "Retenida MT": [
        "existe_retenida", "tipo_retenida", "aislador_retenida", "estado_general_retenida", "corrosion_retenida", "corrosion_barra_ojo", "canaleta_retenida", "proteccion_impacto_retenida", "estado_bloque_retenida"
      ],
      "Uso Compartido": [
        "uso_compartido", "pastoral_bt", "redes_bt", "cables_telecom", "equipos_terceros"
      ],
      "Zona": [
        "zona", "afluencia_terceros", "accesibilidad_grua"
      ],
      "Evaluación del Equipo (Trafo/SED)": [
        "perdida_aceite", "corrosion_equipo", "anclaje_plataforma", "ferreteria_soporte_equipo", "nidos_equipo", "acercamiento_arboles_equipo", "ubicacion_arboles_equipo", "soporte_cable_com", "altura_suelo_base"
      ],
      "Distancias de Seguridad (DMS)": [
        "recorrido_red_mt", "edificaciones_debajo", "dms_edificacion", "dms_comunicaciones", "dms_cartel", "dms_red_bt", "dms_grifo", "dms_poste_ap_bt", "cubierta_proteccion"
      ],
      "Cierre Administrativo": [
        "empresa", "actividad_origen", "observaciones", "revisado_tecsur"
      ]
    };

    // Renderizar dinámicamente todo el formulario
    const dynamicForm = document.getElementById("dynamicForm");
    Object.entries(SCHEMA_MT).forEach(([seccion, campos]) => {
      const secHeader = document.createElement("div");
      secHeader.className = "section-title";
      secHeader.innerText = seccion;
      dynamicForm.appendChild(secHeader);

      campos.forEach(campo => {
        const fGroup = document.createElement("div");
        fGroup.className = "form-group";
        fGroup.innerHTML = `
          <label>${campo.toUpperCase().replace(/_/g, " ")}</label>
          <input type="text" id="${campo}" placeholder="Sin registrar">
        `;
        dynamicForm.appendChild(fGroup);
      });
    });

    const dictadoInput = document.getElementById("dictadoInput");
    const btnProcesar = document.getElementById("btnProcesar");
    const btnPhoto = document.getElementById("btnPhoto");
    const cameraInput = document.getElementById("cameraInput");
    const photoContainer = document.getElementById("photoContainer");
    const photoCounter = document.getElementById("photoCounter");
    const statusText = document.getElementById("statusText");
    const rtTagsContainer = document.getElementById("rtTagsContainer");
    const countdownBadge = document.getElementById("countdownBadge");

    let photos = [];

    // Función para actualizar campos en el formulario
    function setField(fieldName, val) {
      const el = document.getElementById(fieldName);
      if (el) {
        el.value = val;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const parent = el.closest(".form-group");
        parent.classList.add("updated");
        setTimeout(() => parent.classList.remove("updated"), 2500);
      }
    }

    // Motor de inferencia semántico multi-campo[cite: 1]
    function procesarTexto(texto) {
      const t = texto.toLowerCase();
      const updates = [];

      // 1. RETENIDA[cite: 1]
      if (t.includes("retenida") || t.includes("tirante")) {
        updates.push({ campo: "existe_retenida", valor: "SI" });
        if (t.includes("suelta") || t.includes("destemplad") || t.includes("floja")) {
          updates.push({ campo: "estado_general_retenida", valor: "DESTEMPLADA" });
        } else if (t.includes("mantenimiento")) {
          updates.push({ campo: "estado_general_retenida", valor: "REQUIERE MANTENIMIENTO" });
        } else if (t.includes("cambio") || t.includes("rota")) {
          updates.push({ campo: "estado_general_retenida", valor: "REQUIERE CAMBIO" });
        } else if (t.includes("buen estado") || t.includes("bien") || t.includes("conforme")) {
          updates.push({ campo: "estado_general_retenida", valor: "buen estado" });
        }
        if (t.includes("oxido") || t.includes("corrosion")) {
          updates.push({ campo: "corrosion_retenida", valor: "CORROSION ALTA" });
        }
      }

      // 2. AISLADORES[cite: 1]
      if (t.includes("aislador") || t.includes("aisladores")) {
        updates.push({ campo: "existen_aisladores", valor: "SI" });
        if (t.includes("polimerico")) updates.push({ campo: "tipo_aislador", valor: "POLIMERICO" });
        if (t.includes("porcelana")) updates.push({ campo: "tipo_aislador", valor: "PORCELANA" });
        if (t.includes("hibrido")) updates.push({ campo: "tipo_aislador", valor: "HIBRIDO" });

        if (t.includes("roto") || t.includes("quebrado") || t.includes("dañado") || t.includes("cambio")) {
          updates.push({ campo: "estado_general_aislador", valor: "DAÑADO/REQUIERE CAMBIO" });
        } else if (t.includes("buen estado") || t.includes("conforme")) {
          updates.push({ campo: "estado_general_aislador", valor: "buen estado" });
        }
        if (t.includes("polucion") || t.includes("contamina") || t.includes("sucio")) {
          updates.push({ campo: "contaminacion_aislador", valor: "ALTA POLUCION MEDIO Y POCO CARBONIZADO (TARCKING CONSIDERABLE)" });
        }
      }

      // 3. CRUCETAS / MÉNSULAS[cite: 1]
      if (t.includes("cruceta") || t.includes("mensula")) {
        updates.push({ campo: "existen_mensulas", valor: "SI" });
        if (t.includes("madera")) {
          updates.push({ campo: "tipo_mensula", valor: "MADERA" });
          if (t.includes("apolillada") || t.includes("podrid")) updates.push({ campo: "estado_cruceta_madera", valor: "APOLILLADA" });
        } else {
          updates.push({ campo: "tipo_mensula", valor: "CONCRETO" });
          if (t.includes("rajad") || t.includes("fisura")) updates.push({ campo: "estado_cruceta_cac", valor: "RAJADA" });
          if (t.includes("desprendimiento")) updates.push({ campo: "estado_cruceta_cac", valor: "DESPRENDIMIENTO CONCRETO" });
        }
      }

      // 4. SECCIONADOR / CUT OUT[cite: 1]
      if (t.includes("seccionador") || t.includes("cut out") || t.includes("cutout")) {
        updates.push({ campo: "existe_seccionador", valor: "SI" });
        if (t.includes("quemado") || t.includes("chisporroteo") || t.includes("descarga")) {
          updates.push({ campo: "descarga_seccionador", valor: "ALTAMENTE CARBONIZADO (ALTO TRACKING)" });
        }
        if (t.includes("oxido") || t.includes("corrosion") || t.includes("dañado")) {
          updates.push({ campo: "estado_seccionador", valor: "CORROSION ALTA" });
        }
      }

      // 5. PUESTA A TIERRA (PAT)[cite: 1]
      if (t.includes("tierra") || t.includes("puesta a tierra") || t.includes("pat")) {
        if (t.includes("cortado") || t.includes("incompleto") || t.includes("robado")) {
          updates.push({ campo: "conexion_tierra_mt", valor: "EXTERNA INCOMPLETA" });
        } else if (t.includes("buen estado") || t.includes("conforme")) {
          updates.push({ campo: "conexion_tierra_mt", valor: "EXTERNA-BUEN ESTADO" });
        }
        if (t.includes("pozo") && t.includes("tapa rota")) {
          updates.push({ campo: "estado_pozo_mt", valor: "VISIBLE-TAPA ROTA" });
        }
      }

      // 6. POSTE Y BASE[cite: 1]
      if (t.includes("inclinado") || t.includes("desplomado") || t.includes("plomo")) {
        if (t.includes("mayor a 5") || t.includes("muy inclinado")) {
          updates.push({ campo: "estado_inclinacion", valor: "MAYOR A 5°" });
        } else if (t.includes("menor a 5") || t.includes("poco inclinado")) {
          updates.push({ campo: "estado_inclinacion", valor: "MENOR A 5°" });
        } else {
          updates.push({ campo: "estado_inclinacion", valor: "NO PRESENTA" });
        }
      }
      if (t.includes("base") && (t.includes("rajada") || t.includes("concreto desprendido") || t.includes("deterioro"))) {
        updates.push({ campo: "corrosion_base", valor: "B = concreto desprendido" });
      }

      // 7. ÁRBOLES Y DMS[cite: 1]
      if (t.includes("arbol") || t.includes("ramas")) {
        if (t.includes("contacto") || t.includes("tocando")) {
          updates.push({ campo: "acercamiento_arboles", valor: "RAMAS EN CONTACTO" });
        } else if (t.includes("cerca")) {
          updates.push({ campo: "acercamiento_arboles", valor: "RAMAS CERCA" });
        }
      }

      // 8. CÓDIGO DE ACTIVO / POSTE[cite: 1]
      const matchCodigo = t.match(/(?:poste|codigo|estructura)\s*([a-z0-9\-]+)/i);
      if (matchCodigo && !["de", "en", "el", "la"].includes(matchCodigo[1])) {
        updates.push({ campo: "cod_activo_principal", valor: matchCodigo[1].toUpperCase() });
      }

      // 9. Fallback general a observaciones[cite: 1]
      if (updates.length === 0) {
        updates.push({ campo: "observaciones", valor: texto });
      }

      return updates;
    }

    // Función unificada que ejecuta la clasificación
    function ejecutarClasificacion() {
      detenerTemporizador();
      const texto = dictadoInput.value.trim();
      if (!texto) return;

      const resultados = procesarTexto(texto);
      rtTagsContainer.innerHTML = "";

      resultados.forEach(item => {
        setField(item.campo, item.valor);

        const div = document.createElement("div");
        div.className = "rt-item";
        div.innerHTML = `<span class="badge-field">${item.campo}</span><span class="badge-arrow">➔</span><span class="badge-value">${item.valor}</span>`;
        rtTagsContainer.appendChild(div);
      });

      statusText.innerText = `✓ Clasificado con éxito: ${resultados.length} campo(s) llenado(s).`;
      dictadoInput.value = "";
    }

    // LÓGICA DE TEMPORIZADOR DE 10 SEGUNDOS (DEBOUNCING VISUAL)
    let timerId = null;
    let countdownInterval = null;
    let timeLeft = 10;

    function iniciarTemporizador() {
      detenerTemporizador();
      timeLeft = 10;
      countdownBadge.innerText = `${timeLeft}s para procesar`;
      countdownBadge.className = "timer-badge active";

      countdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          countdownBadge.innerText = `${timeLeft}s para procesar`;
        } else {
          detenerTemporizador();
        }
      }, 1000);

      timerId = setTimeout(() => {
        ejecutarClasificacion();
      }, 10000);
    }

    function detenerTemporizador() {
      if (timerId) clearTimeout(timerId);
      if (countdownInterval) clearInterval(countdownInterval);
      timerId = null;
      countdownInterval = null;
      countdownBadge.innerText = "Inactivo";
      countdownBadge.className = "timer-badge";
    }

    // Escuchar dictado o entrada de texto en el textarea
    dictadoInput.addEventListener("input", () => {
      const texto = dictadoInput.value.trim();
      if (texto.length > 0) {
        iniciarTemporizador(); // Reinicia la cuenta de 10s tras cada palabra dictada
      } else {
        detenerTemporizador();
      }
    });

    // Procesamiento inmediato al tocar el botón
    btnProcesar.addEventListener("click", () => {
      ejecutarClasificacion();
    });

    // Enter en teclado físico
    dictadoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        ejecutarClasificacion();
      }
    });

    // Cámara nativa
    btnPhoto.addEventListener("click", () => cameraInput.click());
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64 = event.target.result;
          photos.push(base64);
          
          const thumb = document.createElement("div");
          thumb.className = "photo-thumb";
          thumb.innerHTML = `<img src="${base64}" alt="Foto">`;
          photoContainer.appendChild(thumb);
          
          photoCounter.innerText = `(${photos.length})`;
          statusText.innerText = `✓ Foto ${photos.length} almacenada en memoria.`;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
