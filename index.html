<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspección MT - Inferencia Multi-Campo</title>
  <style>
    :root {
      --primary: #0056b3;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f0f2f5;
      --card: #ffffff;
      --accent: #e7f1ff;
      --border: #dbe2ea;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 10px;
      color: #212529;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    .panel {
      background: var(--card);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    h2 {
      margin: 0 0 10px 0;
      color: var(--primary);
      font-size: 18px;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: #0f172a;
      background: #f1f5f9;
      padding: 8px 10px;
      border-radius: 6px;
      margin: 14px 0 8px 0;
      border-left: 4px solid var(--primary);
    }
    
    /* Botones de acción */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    button {
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-init {
      background: #343a40;
      color: white;
      width: 100%;
      margin-bottom: 8px;
    }
    .btn-mic {
      background: var(--primary);
      color: white;
    }
    .btn-mic.listening {
      background: var(--danger);
      animation: pulse 1.4s infinite;
    }
    .btn-cam {
      background: var(--success);
      color: white;
    }
    button:disabled {
      background: #adb5bd;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Monitor en tiempo real multi-campo */
    .rt-monitor {
      background: #1e293b;
      color: #f8fafc;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
      margin-top: 8px;
    }
    .rt-title {
      font-size: 11px;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .rt-tags-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .rt-item {
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .badge-field {
      background: #0284c7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    .badge-arrow { color: #38bdf8; }
    .badge-value {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Edición manual rápida */
    .manual-edit-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 13px;
      background: #fff;
    }
    .manual-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    /* Galería de fotos */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 6px;
      margin-top: 6px;
    }
    .photo-thumb {
      position: relative;
      width: 100%;
      padding-top: 100%;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ccc;
    }
    .photo-thumb img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    }

    /* Campos de formulario */
    .form-group {
      margin-bottom: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.3s ease;
    }
    .form-group.updated {
      background: var(--accent);
      border-left: 3px solid var(--primary);
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 2px;
    }
    .status {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>

  <!-- WebLLM para inferencia local en el navegador -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // CATÁLOGO COMPLETO SEGÚN schema_mt.py
    const SCHEMA_MT = {
      "Datos Principales": [
        "sst", "set", "nro_alimentador", "tipo_nodo_inicial", "nro_nodo_inicial",
        "tipo_nodo_final", "nro_nodo_final", "tipo_activo_principal", "cod_activo_principal",
        "tipo_activo_referencia", "cod_activo_referencia", "incluido_en_bd", "posibilidad_inspeccion_poste"
      ],
      "Características Generales": [
        "marca", "tipo_poste", "altura_poste", "rotulado_estructura", "etiquetado", "clase_armado", "propiedad_red"
      ],
      "Corrosión e Inclinación": [
        "estado_inclinacion", "corrosion_base", "corrosion_cuerpo_cac", "corrosion_cuerpo_madera", "zocalo", "cimentado", "nivel_empotramiento"
      ],
      "Red Aérea MT": [
        "tipo_conductor_emt", "estado_red_aerea", "cruce_via", "objetos_extranos", "acercamiento_arboles", "ubicacion_arboles"
      ],
      "Ubicación e Impactos": [
        "ubicacion_poste", "tipo_suelo", "expuesto_impacto", "cuenta_proteccion", "estado_riel_bloque"
      ],
      "Conectores y Grapas": [
        "estado_conectores", "estado_grapas"
      ],
      "Aisladores": [
        "existen_aisladores", "tipo_aislador", "contaminacion_aislador", "descarga_aislador", "varilla_soporte", "estado_general_aislador"
      ],
      "Ménsulas y Crucetas": [
        "existen_mensulas", "tipo_mensula", "estado_cruceta_cac", "estado_cruceta_madera", "ferreteria_soporte", "estado_diagonales"
      ],
      "Plataforma y Palomilla": [
        "existe_plataforma", "tipo_plataforma", "estado_plataforma", "tipo_palomilla", "estado_palomilla"
      ],
      "Seccionadores": [
        "existe_seccionador", "estado_seccionador", "contaminacion_seccionador", "descarga_seccionador", "mensula_seccionador"
      ],
      "Terminales": [
        "existen_terminales", "tipo_terminales", "estado_terminal", "contaminacion_terminal", "descarga_terminal"
      ],
      "Subidas y Bajadas": [
        "existe_subidas_bajadas", "tipo_proteccion_cable", "estado_proteccion_cable"
      ],
      "Tableros y Comunicaciones": [
        "tipo_tablero", "tamano_tablero", "estado_general_tablero", "corrosion_tablero", "ferreteria_tablero", "tipo_proteccion_com_bt", "estado_proteccion_com_bt"
      ],
      "Puesta a Tierra": [
        "conexion_tierra_mt", "rotulado_pat", "estado_pozo_mt"
      ],
      "Retenida MT": [
        "existe_retenida", "tipo_retenida", "aislador_retenida", "estado_general_retenida", "corrosion_retenida", "corrosion_barra_ojo", "canaleta_retenida", "proteccion_impacto_retenida", "estado_bloque_retenida"
      ],
      "Uso Compartido": [
        "uso_compartido", "pastoral_bt", "redes_bt", "cables_telecom", "equipos_terceros"
      ],
      "Zona": [
        "zona", "afluencia_terceros", "accesibilidad_grua"
      ],
      "Evaluación del Equipo": [
        "perdida_aceite", "corrosion_equipo", "anclaje_plataforma", "ferreteria_soporte_equipo", "nidos_equipo", "acercamiento_arboles_equipo", "ubicacion_arboles_equipo", "soporte_cable_com", "altura_suelo_base"
      ],
      "Distancias de Seguridad (DMS)": [
        "recorrido_red_mt", "edificaciones_debajo", "dms_edificacion", "dms_comunicaciones", "dms_cartel", "dms_red_bt", "dms_grifo", "dms_poste_ap_bt", "cubierta_proteccion"
      ],
      "Cierre Administrativo": [
        "empresa", "actividad_origen", "observaciones", "revisado_tecsur"
      ]
    };

    const ALL_FIELDS = Object.values(SCHEMA_MT).flat();

    // PROMPT CON REGLA ESTRICTA DE INFERENCIA MULTI-CAMPO
    const SYSTEM_PROMPT = `Eres clasificador técnico para inspección MT.
Extrae e infiere TODOS los campos que apliquen de una frase dictada.
REGLA CLAVE DE INFERENCIA:
Si se reporta condición/anomalía de un elemento (retenida, seccionador, aislador, mensula, etc.), infiere también el campo de existencia con "SI".

Responde ÚNICAMENTE una lista JSON con los campos actualizados:
[{"campo":"<campo>","valor":"<valor>"}]

CAMPOS PERMITIDOS:
${ALL_FIELDS.join(", ")}

EJEMPLO:
Usuario: "la retenida está suelta"
Asistente: [{"campo":"existe_retenida","valor":"SI"},{"campo":"estado_general_retenida","valor":"DESTEMPLADA"}]`;

    // Renderizar dinámicamente el formulario completo y el selector
    const dynamicForm = document.getElementById("dynamicForm");
    const quickSelectField = document.getElementById("quickSelectField");

    Object.entries(SCHEMA_MT).forEach(([seccion, campos]) => {
      const secHeader = document.createElement("div");
      secHeader.className = "section-title";
      secHeader.innerText = seccion;
      dynamicForm.appendChild(secHeader);

      const optGroup = document.createElement("optgroup");
      optGroup.label = seccion;

      campos.forEach(campo => {
        const fGroup = document.createElement("div");
        fGroup.className = "form-group";
        fGroup.innerHTML = `
          <label>${campo.toUpperCase().replace(/_/g, " ")}</label>
          <input type="text" id="${campo}" placeholder="Sin registrar">
        `;
        dynamicForm.appendChild(fGroup);

        const opt = document.createElement("option");
        opt.value = campo;
        opt.innerText = campo;
        optGroup.appendChild(opt);
      });
      quickSelectField.appendChild(optGroup);
    });

    let engine = null;
    const btnInit = document.getElementById("btnInit");
    const btnMic = document.getElementById("btnMic");
    const btnPhoto = document.getElementById("btnPhoto");
    const cameraInput = document.getElementById("cameraInput");
    const photoContainer = document.getElementById("photoContainer");
    const photoCounter = document.getElementById("photoCounter");
    const statusText = document.getElementById("statusText");

    const rtTagsContainer = document.getElementById("rtTagsContainer");
    const quickInputValue = document.getElementById("quickInputValue");

    let photos = [];

    // Función para actualizar campos y UI
    function updateField(fieldName, val) {
      const el = document.getElementById(fieldName);
      if (el) {
        el.value = val;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const parent = el.closest(".form-group");
        parent.classList.add("updated");
        setTimeout(() => parent.classList.remove("updated"), 2500);

        quickSelectField.value = fieldName;
        quickInputValue.value = val;
      }
    }

    // 1. INICIALIZAR IA LOCAL
    btnInit.addEventListener("click", async () => {
      btnInit.disabled = true;
      try {
        statusText.innerText = "Cargando modelo a caché local...";
        engine = await webllm.CreateMLCEngine("SmolLM2-360M-Instruct-q4f16_1-MLC", {
          initProgressCallback: (p) => { statusText.innerText = p.text; }
        });
        statusText.innerText = "✓ IA cargada y lista para operar offline.";
        btnMic.disabled = false;
        btnInit.style.display = "none";
      } catch (err) {
        statusText.innerText = "Error: " + err.message;
        btnInit.disabled = false;
      }
    });

    // 2. CONTROL DE CÁMARA
    btnPhoto.addEventListener("click", () => cameraInput.click());
    cameraInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const base64 = event.target.result;
          photos.push(base64);
          
          const thumb = document.createElement("div");
          thumb.className = "photo-thumb";
          thumb.innerHTML = `<img src="${base64}" alt="Foto">`;
          photoContainer.appendChild(thumb);
          
          photoCounter.innerText = `(${photos.length})`;
          statusText.innerText = `✓ Foto ${photos.length} almacenada.`;
        };
        reader.readAsDataURL(file);
      }
    });

    // 3. MICRÓFONO Y CLASIFICACIÓN MULTI-CAMPO
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognizer = new SpeechRecognition();
      recognizer.lang = "es-PE";
      recognizer.continuous = false;
      recognizer.interimResults = false;

      btnMic.addEventListener("click", () => {
        recognizer.start();
        btnMic.classList.add("listening");
        btnMic.innerHTML = "<span>🔴</span> Escuchando...";
      });

      recognizer.onresult = async (event) => {
        btnMic.classList.remove("listening");
        btnMic.innerHTML = "<span>🎤</span> Dictar";
        const dictado = event.results[0][0].transcript;
        statusText.innerText = "Clasificando inferencias...";

        try {
          const response = await engine.chat.completions.create({
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: dictado }
            ],
            temperature: 0.1,
            max_tokens: 60
          });

          const raw = response.choices[0].message.content.trim();
          const clean = raw.replace(/```json/g, "").replace(/```/g, "").trim();
          const lista = JSON.parse(clean);

          // Renderizar lista en Monitor de Tiempo Real
          rtTagsContainer.innerHTML = "";
          
          const items = Array.isArray(lista) ? lista : [lista];
          items.forEach(item => {
            updateField(item.campo, item.valor);

            const div = document.createElement("div");
            div.className = "rt-item";
            div.innerHTML = `<span class="badge-field">${item.campo}</span><span class="badge-arrow">➔</span><span class="badge-value">${item.valor}</span>`;
            rtTagsContainer.appendChild(div);
          });

          statusText.innerText = `✓ Se actualizaron ${items.length} campos.`;
        } catch (e) {
          console.error(e);
          updateField("observaciones", dictado);
          rtTagsContainer.innerHTML = `<div class="rt-item"><span class="badge-field">observaciones</span><span class="badge-arrow">➔</span><span class="badge-value">${dictado}</span></div>`;
          statusText.innerText = "Derivado a observaciones.";
        }
      };

      recognizer.onerror = () => {
        btnMic.classList.remove("listening");
        btnMic.innerHTML = "<span>🎤</span> Dictar";
      };
    }

    // 4. EDICIÓN MANUAL DESDE PANEL SUPERIOR
    quickSelectField.addEventListener("change", () => {
      const target = document.getElementById(quickSelectField.value);
      if (target) quickInputValue.value = target.value;
    });

    quickInputValue.addEventListener("input", (e) => {
      const sel = quickSelectField.value;
      const val = e.target.value;
      const target = document.getElementById(sel);
      if (target) {
        target.value = val;
        rtTagsContainer.innerHTML = `<div class="rt-item"><span class="badge-field">${sel}</span><span class="badge-arrow">➔</span><span class="badge-value">${val || "(vacío)"}</span></div>`;
      }
    });

    // 5. EDICIÓN MANUAL DIRECTA EN FORMULARIO
    dynamicForm.addEventListener("input", (e) => {
      if (e.target.tagName === "INPUT") {
        const sel = e.target.id;
        const val = e.target.value;
        quickSelectField.value = sel;
        quickInputValue.value = val;
        rtTagsContainer.innerHTML = `<div class="rt-item"><span class="badge-field">${sel}</span><span class="badge-arrow">➔</span><span class="badge-value">${val || "(vacío)"}</span></div>`;
      }
    });
  </script>
</head>
<body>
  <div class="container">
    
    <div class="panel">
      <h2>Inspección de Red MT (TECSUR/LDS)</h2>
      
      <button id="btnInit" class="btn-init">Inicializar Motor de IA</button>
      
      <div class="action-grid">
        <button id="btnMic" class="btn-mic" disabled>
          <span>🎤</span> Dictar
        </button>
        <button id="btnPhoto" class="btn-cam">
          <span>📷</span> Tomar Foto
        </button>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">

      <!-- MONITOR EN TIEMPO REAL MULTI-CAMPO -->
      <div class="rt-monitor">
        <div class="rt-title">En tiempo real (Última inferencia)</div>
        <div id="rtTagsContainer" class="rt-tags-container">
          <div class="rt-item">
            <span class="badge-field">esperando_dictado</span>
            <span class="badge-arrow">➔</span>
            <span class="badge-value">sin datos</span>
          </div>
        </div>
      </div>

      <!-- EDICIÓN MANUAL RÁPIDA -->
      <div class="manual-edit-box">
        <label style="color:#0056b3; font-weight:bold;">Modificar campo manualmente:</label>
        <div class="manual-grid">
          <select id="quickSelectField"></select>
          <input type="text" id="quickInputValue" placeholder="Escribe el valor...">
        </div>
      </div>

      <div id="statusText" class="status">Pulsa "Inicializar Motor" para comenzar.</div>

      <!-- GALERÍA DE FOTOS -->
      <h4 style="margin: 8px 0 2px 0; font-size: 11px; color: #555;">
        Fotos en sesión <span id="photoCounter">(0)</span>
      </h4>
      <div id="photoContainer" class="photo-grid"></div>
    </div>

    <!-- FORMULARIO COMPLETO RENDERIZADO DESDE EL ESQUEMA -->
    <div class="panel">
      <h3 style="margin-top:0; color:#0056b3;">Catálogo de Inspección Completo</h3>
      <div id="dynamicForm"></div>
    </div>

  </div>
</body>
</html>
