<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inspección MT Móvil - Calibrado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.basic.min.js"></script>
  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.14.0';
    env.allowLocalModels = false;
    window.pipeline = pipeline;
  </script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; }
    select, input, textarea { background-color: #0f172a !important; color: #f8fafc !important; border: 1px solid #475569 !important; border-radius: 8px; }
  </style>
</head>
<body class="p-4 max-w-lg mx-auto pb-24">

  <div class="mb-4 text-center">
    <h1 class="text-2xl font-bold text-sky-400">⚡ Inspección MT (Calibrado)</h1>
    <div class="flex justify-center gap-2 mt-1">
      <span class="text-[10px] bg-slate-800 text-teal-400 px-2 py-0.5 rounded border border-teal-800">Capa 1: Regex ✓</span>
      <span class="text-[10px] bg-slate-800 text-sky-400 px-2 py-0.5 rounded border border-sky-800">Capa 2: Fuzzy (0.35) ✓</span>
      <span id="badge-ia" class="text-[10px] bg-slate-800 text-amber-400 px-2 py-0.5 rounded border border-amber-800">Capa 3: Cargando IA...</span>
    </div>
  </div>

  <div class="card p-4 mb-4">
    <div class="grid grid-cols-2 gap-3 mb-3">
      <div>
        <label class="text-xs font-semibold text-slate-400">Cód. Activo:</label>
        <input type="text" id="cod_activo" placeholder="Ej: P-10243" class="w-full p-2 text-sm mt-1">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-400">Responsable:</label>
        <input type="text" id="responsable" value="INSPECTOR" class="w-full p-2 text-sm mt-1">
      </div>
    </div>
    <button id="btn-iniciar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
      ⏱️ Iniciar Inspección
    </button>
    <p id="lbl-timestamp" class="text-xs text-slate-400 text-center mt-2">Timestamp: --:--:--</p>
  </div>

  <div class="card p-4 mb-4">
    <label class="text-xs font-semibold text-slate-400">Dictado por Voz:</label>
    <textarea id="txt-dictado" rows="3" class="w-full p-2 text-sm mt-1" placeholder="Ej: 'Poste concreto de trece metros inclinado mayor a 5 grados sin zócalo con cimentación aislador fogueado'"></textarea>
    <button id="btn-procesar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg text-sm mt-2 transition">
      ⚡ Procesar Dictado Calibrado
    </button>
  </div>

  <div class="card p-4 mb-4">
    <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
      <h2 class="text-sm font-bold text-sky-400">📋 Campos Registrados (Protegidos)</h2>
      <span class="text-[10px] text-slate-400">Toca ✏️ para editar</span>
    </div>
    <div id="monitor-valores" class="space-y-2 text-xs max-h-72 overflow-y-auto">
      <p class="text-slate-500 italic">No hay valores detectados aún.</p>
    </div>
  </div>

  <div class="space-y-3">
    <button id="btn-guardar" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-lg text-sm transition">
      💾 Guardar Estructura Completa
    </button>
    <div class="flex gap-2">
      <button id="btn-descargar-excel" class="w-1/2 bg-teal-700 hover:bg-teal-800 text-white font-semibold py-2 px-3 rounded-lg text-xs transition">
        📥 Descargar Excel (.xlsx)
      </button>
      <button id="btn-descargar-csv" class="w-1/2 bg-slate-700 hover:bg-slate-800 text-white font-semibold py-2 px-3 rounded-lg text-xs transition">
        📥 Descargar CSV (.csv)
      </button>
    </div>
    <p id="lbl-conteo" class="text-xs text-center text-slate-400">Estructuras en memoria: 0</p>
  </div>

  <script type="module">
    const ESQUEMA_DESACOPLADO = {
      "poste": {
        titulo: "Poste y Fuste",
        campos: {
          tipo_poste: {
            label: "TIPO DE POSTE",
            ancla: ["poste", "fuste", "estructura", "material"],
            opciones: ["CONCRETO", "MADERA", "METAL", "PRFV"],
            aliases: ["concreto", "madera", "metal", "cemento", "cac", "fierro"]
          },
          altura_poste: {
            label: "ALTURA (M)",
            ancla: ["altura", "mide", "metros", "poste", "de 13", "de 11", "de 15", "de 9", "de 8"],
            opciones: ["11", "13", "15", "9", "8"],
            aliases: ["11", "13", "15", "9", "8"]
          },
          corrosion_cuerpo: {
            label: "ESTADO CUERPO POSTE",
            ancla: ["cuerpo", "fuste", "media caña", "tronco"],
            opciones: ["Buen Estado", "Rajaduras", "Descascarado Severo"],
            aliases: ["cuerpo buen estado", "cuerpo rajado", "rajaduras cuerpo", "fisura cuerpo", "cascaron"]
          }
        }
      },
      "base_fundacion": {
        titulo: "Base y Fundación",
        campos: {
          corrosion_base: {
            label: "CORROSIÓN BASE POSTE",
            ancla: ["base", "patas", "arranque", "pie"],
            opciones: ["Conforme", "A (Muy Mal Estado)", "B1 (Pérdida Sección)", "B (Concreto Desprendido)", "CV (Encamisado/Reforzado)"],
            aliases: ["base conforme", "base muy mal estado", "patas comidas", "base carcomida", "base desprendida", "base encamisada", "fierro al aire", "dado de refuerzo"]
          },
          zocalo: {
            label: "ZÓCALO",
            ancla: ["zocalo", "collarin"],
            opciones: ["SI", "NO"],
            aliases: ["zocalo", "collarin"]
          },
          cimentado: {
            label: "CIMENTADO",
            ancla: ["cimentad", "cimentacion", "dado concreto", "fundacion"],
            opciones: ["SI", "NO"],
            aliases: ["cimentado", "cimentacion", "dado"]
          },
          estado_inclinacion: {
            label: "INCLINACIÓN",
            ancla: ["inclinad", "plomo", "desplome", "grados", "caida"],
            opciones: ["No Presenta", "Menor a 5°", "Mayor a 5°"],
            aliases: ["no presenta inclinacion", "aplomado", "menor a 5 grados", "mayor a 5 grados", "inclinado", "inclinacion"]
          }
        }
      },
      "cruceta": {
        titulo: "Ménsulas / Crucetas",
        campos: {
          tipo_mensula: {
            label: "TIPO CRUCETA",
            ancla: ["cruceta", "mensula", "armadura"],
            opciones: ["CONCRETO", "MADERA"],
            aliases: ["cruceta concreto", "cruceta madera", "mensula concreto", "mensula madera"]
          },
          estado_cruceta: {
            label: "ESTADO CRUCETA",
            ancla: ["cruceta", "mensula"],
            opciones: ["Buen Estado", "Rajada/Desprendimiento", "Apolillada/Revirada", "Pernos Oxidados"],
            aliases: ["cruceta buen estado", "cruceta rajada", "cruceta desprendimiento", "cruceta apolillada", "cruceta torcida", "pernos soporte oxidados", "pernos podridos"]
          }
        }
      },
      "aisladores": {
        titulo: "Aisladores MT",
        campos: {
          tipo_aislador: {
            label: "TIPO AISLADOR",
            ancla: ["aislador", "aisladores"],
            opciones: ["POLIMERICO", "PORCELANA"],
            aliases: ["aislador polimerico", "aislador porcelana", "aislador sintetico", "aislador goma", "aislador loza", "campana"]
          },
          condicion_aislador: {
            label: "CONDICIÓN AISLADOR",
            ancla: ["aislador", "aisladores", "flameo", "fogueado", "chispazo"],
            opciones: ["Buen Estado", "Fogueado (Alto Tracking)", "Alta Polución/Salitre", "Dañado/Roto"],
            aliases: ["aislador buen estado", "fogueado", "flameado", "chisporroteado", "chispazo", "aislador quemado", "embarrado", "salitre", "aislador roto"]
          }
        }
      },
      "retenida": {
        titulo: "Retenida MT",
        campos: {
          estado_retenida: {
            label: "RETENIDA MT",
            ancla: ["retenida", "tirante", "viento"],
            opciones: ["No Requiere", "Buen Estado", "Destemplada/Floja", "Requiere Mantenimiento/Cambio"],
            aliases: ["no requiere retenida", "sin retenida", "no tiene retenida", "retenida buen estado", "tirante flojo", "retenida destemplada", "cable suelto", "panza", "nuez rota"]
          }
        }
      }
    };

    let extractor = null;
    let embeddingsCatalogo = {};
    let fuseInstancia = null;
    let registrosSesion = [];
    let registroEnProceso = {};
    let timestampInicio = "";
    let contadorActividad = 0;

    const NUMEROS = { "cero": 0, "uno": 1, "dos": 2, "tres": 3, "cuatro": 4, "cinco": 5, "seis": 6, "siete": 7, "ocho": 8, "nueve": 9, "diez": 10, "once": 11, "doce": 12, "trece": 13, "quince": 15 };

    function normalizarTexto(t) {
      let texto = t.toLowerCase();
      for (const [pal, num] of Object.entries(NUMEROS)) {
        texto = texto.replace(new RegExp(`\\b${pal}\\b`, 'gi'), num.toString());
      }
      return texto;
    }

    function inicializarFuzzy() {
      const items = [];
      for (const [secKey, sec] of Object.entries(ESQUEMA_DESACOPLADO)) {
        for (const [cKey, cfg] of Object.entries(sec.campos)) {
          cfg.opciones.forEach(opc => items.push({ secKey, cKey, target: opc, term: opc.toLowerCase() }));
          cfg.aliases.forEach(al => items.push({ secKey, cKey, target: null, term: al.toLowerCase() }));
        }
      }
      // Umbral calibrado a 0.35 (tolerante a errores acústicos del dictado)
      fuseInstancia = new Fuse(items, { keys: ['term'], threshold: 0.35, ignoreLocation: true });
    }
    inicializarFuzzy();

    async function inicializarIA() {
      try {
        extractor = await window.pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
        document.getElementById('badge-ia').innerText = "Capa 3: Semántica IA (0.52) ✓";
        document.getElementById('badge-ia').className = "text-[10px] bg-slate-800 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800";

        for (const [secKey, sec] of Object.entries(ESQUEMA_DESACOPLADO)) {
          for (const [cKey, cfg] of Object.entries(sec.campos)) {
            embeddingsCatalogo[`${secKey}.${cKey}`] = [];
            for (const opc of cfg.opciones) {
              const contextoCompleto = `${cfg.label}: ${opc}`;
              const out = await extractor(contextoCompleto, { pooling: 'mean', normalize: true });
              embeddingsCatalogo[`${secKey}.${cKey}`].push({ opcion: opc, vector: Array.from(out.data) });
            }
          }
        }
      } catch (e) {
        document.getElementById('badge-ia').innerText = "Capa 3: Desactivada";
      }
    }
    inicializarIA();

    function cosSim(a, b) {
      let d = 0, na = 0, nb = 0;
      for (let i = 0; i < a.length; i++) { d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
      return d / (Math.sqrt(na) * Math.sqrt(nb));
    }

    function dividirFragmentos(texto) {
      return texto
        .replace(/\.\.\./g, ',')
        .replace(/;/g, ',')
        .replace(/\b(y además|además|pero|cuenta con|no cuenta)\b/gi, ',')
        .split(',')
        .map(s => s.trim())
        .filter(s => s.length > 1);
    }

    async function procesarCalibrado(textoCrudo) {
      const extracciones = {};
      const texto = normalizarTexto(textoCrudo);

      // ==========================================
      // FASE 1: EVALUACIÓN DETERMINISTA GLOBAL
      // ==========================================

      // 1.1 Inclinación Numérica y Cualitativa
      const idInc = "base_fundacion.estado_inclinacion";
      if (!registroEnProceso[idInc]) {
        const mGrados = texto.match(/(\d+)\s*(?:°|grados?)/i);
        if (mGrados) {
          const g = parseInt(mGrados[1]);
          extracciones[idInc] = g > 5 ? "Mayor a 5°" : (g > 0 ? "Menor a 5°" : "No Presenta");
        } else if (/\b(sin inclinacion|al plomo|a plomo|bien aplomado|no presenta inclinacion)\b/i.test(texto)) {
          extracciones[idInc] = "No Presenta";
        } else if (/\b(inclinad|desplomad|ladead)\b/i.test(texto)) {
          if (/\b(mayor|bastante|muy|peligro)\b/i.test(texto)) extracciones[idInc] = "Mayor a 5°";
          else if (/\b(menor|poco|leve|ligera)\b/i.test(texto)) extracciones[idInc] = "Menor a 5°";
        }
      }

      // 1.2 Altura del Poste
      const idAlt = "poste.altura_poste";
      if (!registroEnProceso[idAlt]) {
        const mAlt = texto.match(/\b(11|13|15|9|8)\b\s*(?:m|mts|metros)?/i);
        if (mAlt && (mAlt[0].includes("m") || /\b(altura|poste|mide|tamano|largo|de 13|de 11|de 15|de 9|de 8)\b/i.test(texto))) {
          extracciones[idAlt] = mAlt[1];
        }
      }

      // 1.3 Material del Poste
      const idTipoPoste = "poste.tipo_poste";
      if (!registroEnProceso[idTipoPoste]) {
        if (/\b(concreto|cemento|cac)\b/i.test(texto) && !/\bcruceta\b/i.test(texto)) extracciones[idTipoPoste] = "CONCRETO";
        else if (/\bmadera\b/i.test(texto) && !/\bcruceta\b/i.test(texto)) extracciones[idTipoPoste] = "MADERA";
        else if (/\b(metal|fierro|metalico)\b/i.test(texto)) extracciones[idTipoPoste] = "METAL";
        else if (/\b(prfv|fibra)\b/i.test(texto)) extracciones[idTipoPoste] = "PRFV";
      }

      // 1.4 Retenida Ausente
      const idRet = "retenida.estado_retenida";
      if (!registroEnProceso[idRet] && /\b(sin retenida|no tiene retenida|no requiere retenida|sin tirante)\b/i.test(texto)) {
        extracciones[idRet] = "No Requiere";
      }

      // ==========================================
      // FASE 2: EVALUACIÓN POR FRAGMENTOS (FUZZY + IA)
      // ==========================================
      const fragmentos = dividirFragmentos(texto);

      for (const frag of fragmentos) {
        const fragLow = frag.toLowerCase();

        for (const [secKey, sec] of Object.entries(ESQUEMA_DESACOPLADO)) {
          for (const [cKey, cfg] of Object.entries(sec.campos)) {
            const idCampo = `${secKey}.${cKey}`;

            if (registroEnProceso[idCampo] || extracciones[idCampo]) continue;

            // Filtro flexible: coincide ancla O coincide algún alias directamente
            const coincideAncla = cfg.ancla.some(a => new RegExp(`\\b${a}`, 'i').test(fragLow));
            const coincideAlias = cfg.aliases.some(al => new RegExp(`\\b${al}`, 'i').test(fragLow));

            if (!coincideAncla && !coincideAlias) continue;

            // Detección de binarios SI / NO
            if (JSON.stringify(cfg.opciones) === JSON.stringify(["SI", "NO"])) {
              const tieneNegacion = /\b(sin|no|falta|cero|sin zocalo|no tiene)\b/i.test(fragLow);
              extracciones[idCampo] = tieneNegacion ? "NO" : "SI";
              continue;
            }

            // Capa 2: Fuzzy Matching tolerante (0.35)
            if (fuseInstancia) {
              const res = fuseInstancia.search(fragLow);
              const m = res.find(r => r.item.secKey === secKey && r.item.cKey === cKey);
              if (m && m.score <= 0.35 && m.item.target) {
                extracciones[idCampo] = m.item.target;
                continue;
              }
            }

            // Capa 3: Semántica con umbral calibrado al 52% (0.52)
            if (extractor && embeddingsCatalogo[idCampo]) {
              const out = await extractor(frag, { pooling: 'mean', normalize: true });
              const vUser = Array.from(out.data);

              let bestScore = 0;
              let bestOp = null;
              for (const item of embeddingsCatalogo[idCampo]) {
                const s = cosSim(vUser, item.vector);
                if (s > bestScore) {
                  bestScore = s;
                  bestOp = item.opcion;
                }
              }

              // Umbral 0.52 calibrado
              if (bestScore >= 0.52) {
                extracciones[idCampo] = bestOp;
              }
            }
          }
        }
      }

      return extracciones;
    }

    function renderMonitor() {
      const cont = document.getElementById('monitor-valores');
      cont.innerHTML = "";
      let tieneValores = false;

      for (const [secKey, sec] of Object.entries(ESQUEMA_DESACOPLADO)) {
        for (const [cKey, cfg] of Object.entries(sec.campos)) {
          const id = `${secKey}.${cKey}`;
          if (registroEnProceso[id]) {
            tieneValores = true;
            const div = document.createElement('div');
            div.className = "flex flex-col bg-slate-900 p-2 rounded border border-slate-700 gap-1";
            div.id = `card-${id}`;
            div.innerHTML = `
              <div class="flex justify-between items-center">
                <span class="text-slate-300 font-medium">${cfg.label}</span>
                <div class="flex items-center gap-2">
                  <span class="text-emerald-400 font-bold">${registroEnProceso[id]}</span>
                  <button class="btn-editar bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-sky-400" data-id="${id}">✏️</button>
                  <button class="btn-borrar bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-rose-400" data-id="${id}">🗑️</button>
                </div>
              </div>
              <div id="editor-${id}" class="hidden mt-2 pt-2 border-t border-slate-800"></div>
            `;
            cont.appendChild(div);
          }
        }
      }

      if (!tieneValores) cont.innerHTML = '<p class="text-slate-500 italic">No hay valores detectados aún.</p>';

      document.querySelectorAll('.btn-editar').forEach(b => b.addEventListener('click', e => abrirEditor(e.target.dataset.id)));
      document.querySelectorAll('.btn-borrar').forEach(b => b.addEventListener('click', e => {
        delete registroEnProceso[e.target.dataset.id];
        renderMonitor();
      }));
    }

    function abrirEditor(id) {
      const [secKey, cKey] = id.split('.');
      const cfg = ESQUEMA_DESACOPLADO[secKey].campos[cKey];
      const div = document.getElementById(`editor-${id}`);
      if (!div.classList.contains('hidden')) { div.classList.add('hidden'); return; }
      div.classList.remove('hidden');
      div.innerHTML = "";

      const sel = document.createElement('select');
      sel.className = "w-full p-1 text-xs mb-1";
      cfg.opciones.forEach(op => {
        const opt = document.createElement('option');
        opt.value = op; opt.innerText = op;
        if (op === registroEnProceso[id]) opt.selected = true;
        sel.appendChild(opt);
      });
      const btn = document.createElement('button');
      btn.className = "w-full bg-blue-600 text-white font-semibold py-1 rounded text-xs mt-1";
      btn.innerText = "Confirmar Cambio";
      btn.onclick = () => { registroEnProceso[id] = sel.value; renderMonitor(); };
      div.appendChild(sel); div.appendChild(btn);
    }

    document.getElementById('btn-iniciar').addEventListener('click', () => {
      const d = new Date();
      timestampInicio = d.toISOString().replace('T', ' ').substring(0, 19);
      contadorActividad++;
      document.getElementById('lbl-timestamp').innerText = `Timestamp: ${timestampInicio}`;
      registroEnProceso = {};
      renderMonitor();
    });

    document.getElementById('btn-procesar').addEventListener('click', async () => {
      const txt = document.getElementById('txt-dictado').value;
      if (!txt.trim()) return;
      const res = await procesarCalibrado(txt);
      Object.assign(registroEnProceso, res);
      renderMonitor();
      document.getElementById('txt-dictado').value = "";
    });

    document.getElementById('btn-guardar').addEventListener('click', () => {
      const cod = document.getElementById('cod_activo').value.trim();
      if (!cod) { alert("Ingrese el Código de Activo Principal."); return; }
      const fila = {
        "Fecha/Hora": timestampInicio || new Date().toISOString().replace('T', ' ').substring(0, 19),
        "Cód. Activo": cod,
        "Responsable": document.getElementById('responsable').value.trim()
      };
      for (const [secKey, sec] of Object.entries(ESQUEMA_DESACOPLADO)) {
        for (const [cKey, cfg] of Object.entries(sec.campos)) {
          fila[`${sec.titulo} - ${cfg.label}`] = registroEnProceso[`${secKey}.${cKey}`] || "";
        }
      }
      registrosSesion.push(fila);
      registroEnProceso = {};
      document.getElementById('cod_activo').value = "";
      document.getElementById('lbl-conteo').innerText = `Estructuras en memoria: ${registrosSesion.length}`;
      renderMonitor();
      alert(`Estructura ${cod} guardada con éxito.`);
    });

    document.getElementById('btn-descargar-excel').addEventListener('click', () => {
      if (registrosSesion.length === 0) return alert("No hay datos para exportar.");
      const ws = XLSX.utils.json_to_sheet(registrosSesion);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Inspecciones_MT");
      XLSX.writeFile(wb, `inspeccion_MT_${Date.now()}.xlsx`);
    });

    document.getElementById('btn-descargar-csv').addEventListener('click', () => {
      if (registrosSesion.length === 0) return alert("No hay datos para exportar.");
      const ws = XLSX.utils.json_to_sheet(registrosSesion);
      const csv = XLSX.utils.sheet_to_csv(ws);
      const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `inspeccion_MT_${Date.now()}.csv`;
      link.click();
    });
  </script>
</body>
</html>
